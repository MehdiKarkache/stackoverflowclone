spring.application.name=backend

# Base de données : H2 en mémoire par défaut, PostgreSQL via variables d'environnement (Docker)
spring.datasource.url=${DB_URL:jdbc:h2:mem:stackclone;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Charge les relations paresseuses par lots (évite le problème N+1 sur les listes)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-a-changer-en-production-0123456789}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}

management.endpoints.web.exposure.include=health
