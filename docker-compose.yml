services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stackclone
      POSTGRES_USER: stackclone
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stackclone}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackclone -d stackclone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/stackclone
      DB_USERNAME: stackclone
      DB_PASSWORD: ${DB_PASSWORD:-stackclone}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32-bytes-min}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db-data:
